name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t churn-api .
      - name: Run container and check health
        run: |
          docker run -d -p 8000:8000 --name api churn-api
          for i in $(seq 1 15); do
            curl --fail http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1